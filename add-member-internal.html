<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- stylesheet -->
    <link rel="stylesheet" href="./style-form.css">

    <!-- style sheet and Google font Fredoka -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Fredoka:wght@300..700&family=Noto+Sans:ital,wght@0,100..900;1,100..900&family=Sigmar&family=TikTok+Sans:opsz,wght@12..36,300..900&display=swap" rel="stylesheet">

    <title>Add Member</title>
</head>
<body>
    <header>
        <h1>Internal Use Only</h1>
        <p>Disclaimer: this page is for internal use of the HR team only</p>
    </header>
    <main>
        <form id="addNewMemberForm">
            <div>
                <label for="name">Name</label>
                <input required type="text" id="name" placeholder="Name Lastname">
            </div>
            
            <div>
                <label for="role">Role</label>
                <input required type="text" id="role">
            </div>
            
            <div>
                <label for="email">Email</label>
                <input required type="email" id="email">
            </div>

            <div>
                <label for="img">Immagine Profilo</label>
                <input required type="text" id="img" placeholder="Inserisci nome del file">
            </div>
            
            <button id="newMember" type="submit">Add Member</button>
        </form>
    </main>
</body>
</html>

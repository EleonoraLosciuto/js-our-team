<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Member</title>
</head>
<body>
    <header>
        <h1>Internal Use Only</h1>
        <p>Disclaimer: this page is for internal use of the HR team only</p>
    </header>
    <main>
        <form id="addMemberForm">
            <label for="name">Name</label>
            <input type="text" id="name" placeholder="Name Last-Name">
            
            <label for="role">Role</label>
            <input type="text" id="role">
            
            <label for="email">Email</label>
            <input type="email" id="email">

            <label for="img">Immagine Profilo</label>
            <input type="text" id="img" placeholder="Inserisci nome del file">
            
            
            <button type="submit">Aggiungi Membro</button>
        </form>
    </main>
</body>
</html>
